models:
  - unet
  - portable_bridge_legacy
seeds: [42, 123, 2026]
splits:
  train: /beegfs/home/mrashid/datasets/Healthcare/PB_U-NET/data/kvasir_seg/metadata/train_split.csv
  val: /beegfs/home/mrashid/datasets/Healthcare/PB_U-NET/data/kvasir_seg/metadata/val_split.csv
  test: /beegfs/home/mrashid/datasets/Healthcare/PB_U-NET/data/kvasir_seg/metadata/test_split.csv
out_root: ../runs/multiseed_kvasir
training:
  epochs: 100
  batch_size: 8
  image_size: 256
  channels: 3
  filters: [32, 64, 128]
  lr: 0.0001
  loss: bce_dice
  num_workers: 4
  device: auto
  patience: 30
  lr_patience: 10
  lr_factor: 0.05
  threshold: 0.5
  augment: false
  amp: true
