batch_size: 8
channels: 3
dataset:
  name: busi
  prepared_root: /beegfs/home/mrashid/datasets/Healthcare/PB_U-NET/data/BUSI
  images: /beegfs/home/mrashid/datasets/Healthcare/PB_U-NET/data/BUSI/lesions/images/**/*.png
  masks: /beegfs/home/mrashid/datasets/Healthcare/PB_U-NET/data/BUSI/lesions/masks/**/*.png
