model: portable_bridge
image_size: 256
channels: 3
filters: [32, 64, 128]
batch_size: 8
learning_rate: 0.0001
epochs: 100
loss: BCEWithLogitsLoss
optimizer: Adam
threshold: 0.5
split:
  type: image_level_legacy
  train: 0.70
  validation: 0.15
  test: 0.15
  seed: 42
postprocessing:
  - hole_filling
  - largest_connected_component
notes:
  - "This reproduces the active implementation rather than the paper's claimed single-channel input."
  - "For publication reruns, replace image-level splitting with patient/group-level splitting."
