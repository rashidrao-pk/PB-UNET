model: unet
image_size: 256
channels: 1
filters:
- 32
- 64
- 128
batch_size: 8
learning_rate: 0.0001
epochs: 100
loss: bce_dice
threshold: 0.5
split:
  type: case
  validation: 0.15
  test: 0.15
  seed: 42
postprocessing: []
dataset:
  name: brats2020
  raw_root: /beegfs/home/mrashid/datasets/Healthcare/PB_U-NET/raw/brats2020
  prepared_root: /beegfs/home/mrashid/datasets/Healthcare/PB_U-NET/data/brats2020
  images: /beegfs/home/mrashid/datasets/Healthcare/PB_U-NET/data/brats2020/images/*.png
  masks: /beegfs/home/mrashid/datasets/Healthcare/PB_U-NET/data/brats2020/masks/*.png
  target: Whole brain tumor (labels 1,2,4)
  preparation: Canonical RAS axial FLAIR; nonzero volume percentile 1/99 uint8 scaling;
    include nonzero MRI slices
  modality: flair
  region: WT
  expected_cases: 369
train:
  out_dir: ../runs/brats2020_unet
  num_workers: 4
  device: auto
  amp: true
  augment: false
  patience: 30
  lr_patience: 10
  lr_factor: 0.05
  train_split: /beegfs/home/mrashid/datasets/Healthcare/PB_U-NET/data/brats2020/metadata/train_split.csv
  val_split: /beegfs/home/mrashid/datasets/Healthcare/PB_U-NET/data/brats2020/metadata/val_split.csv
  test_split: /beegfs/home/mrashid/datasets/Healthcare/PB_U-NET/data/brats2020/metadata/test_split.csv
  deterministic: true
evaluate:
  checkpoint: ../runs/brats2020_unet/best_dice.pt
  split_csv: /beegfs/home/mrashid/datasets/Healthcare/PB_U-NET/data/brats2020/metadata/test_split.csv
  out_dir: ../runs/brats2020_unet/evaluation
  device: auto
  postprocess: false
predict:
  image: null
  checkpoint: ../runs/brats2020_unet/best_dice.pt
  output: ../runs/brats2020_unet/prediction.png
  device: auto
  postprocess: false
smoke_test:
  out_dir: ../runs/smoke_test/brats2020
  num_samples: 6
notes:
- 2D single-modality binary experiment; internal case holdout of labeled training
  release, not official 3D challenge evaluation.
- Do not combine 2020 and 2021 as independent cohorts; releases may share subjects.
