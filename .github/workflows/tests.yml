name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test]' build
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python audit/verify_parameter_counts.py
      - run: python -m build
      - name: Check wheel imports outside checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "from portable_bridge_unet.models import build_model; from portable_bridge_unet.data.preprocess import prepare_dataset; print(type(build_model('unet')).__name__)"
      - name: Record CI environment
        if: always()
        run: python -m pip freeze > ci-packages.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment-python-${{ matrix.python }}
          path: ci-packages.txt
