[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-bridge-unet"
version = "0.2.0"
description = "PyTorch implementation of Portable-Bridge U-Net for medical image segmentation"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "pydicom>=3.0",
  "torch>=2.2",
  "numpy>=1.24",
  "opencv-python>=4.8",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
